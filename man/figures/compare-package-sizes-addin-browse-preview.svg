<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="700">Compare Package File Sizes (Updated Addin UI)</text>

  <text x="20" y="95" font-family="Arial, sans-serif" font-size="20">Development package path:</text>
  <rect x="20" y="110" width="860" height="42" fill="none" stroke="#222" stroke-width="2"/>
  <text x="30" y="137" font-family="Arial, sans-serif" font-size="16" fill="#444">/path/to/dev/package/or.tar.gz</text>
  <rect x="20" y="165" width="280" height="40" fill="none" stroke="#222" stroke-width="2"/>
  <text x="32" y="190" font-family="Arial, sans-serif" font-size="16">Browse development path</text>

  <text x="20" y="255" font-family="Arial, sans-serif" font-size="20">Installed package path:</text>
  <rect x="20" y="270" width="860" height="42" fill="none" stroke="#222" stroke-width="2"/>
  <text x="30" y="297" font-family="Arial, sans-serif" font-size="16" fill="#444">/path/to/installed/package/or.tar.gz</text>
  <rect x="20" y="325" width="260" height="40" fill="none" stroke="#222" stroke-width="2"/>
  <text x="32" y="350" font-family="Arial, sans-serif" font-size="16">Browse installed path</text>

  <text x="20" y="415" font-family="Arial, sans-serif" font-size="20">Report output directory:</text>
  <rect x="20" y="430" width="860" height="42" fill="none" stroke="#222" stroke-width="2"/>
  <text x="30" y="457" font-family="Arial, sans-serif" font-size="16" fill="#444">~/</text>
  <rect x="20" y="485" width="245" height="40" fill="none" stroke="#222" stroke-width="2"/>
  <text x="32" y="510" font-family="Arial, sans-serif" font-size="16">Browse output directory</text>

  <rect x="20" y="560" width="170" height="42" fill="none" stroke="#222" stroke-width="2"/>
  <text x="32" y="587" font-family="Arial, sans-serif" font-size="16">Create reports</text>

  <text x="20" y="725" font-family="Arial, sans-serif" font-size="16" fill="#333">Typing remains enabled in all text fields; browse buttons are now available for path selection.</text>
</svg>
